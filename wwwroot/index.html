<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChequeTrack</title><link rel="icon" type="image/svg+xml" href="/img/logo.svg">
<meta name="theme-color" content="#FFC400">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Equpation brand: ChequeTrack v1 palette: yellow #FFC400, near-black ink, neutral greys */
  --y:#FFC400;--y2:#FFD84D;--ysoft:#FFF6D6;--ybg:#FFFBEA;--yline:#F2DB8A;--ydark:#7A5A00;--ink:#121212;
  --bg:#F4F4F2;--card:#fff;--tx:#2B2B2B;--mut:#6F6F6F;--line:#E7E5E0;--line2:#F0EFEB;--in:#D5D3CE;
  --ok:#2E7D32;--oksoft:#E6F4E7;--warn:#9A6200;--warnsoft:#FFF4D9;--bad:#C62828;--badsoft:#FDE7E7;
  --info:#2A6FB8;--infosoft:#E3EEFA;--vio:#6A3FBF;--viosoft:#EFE7FC;--teal:#0E7C86;--tealsoft:#DDF5F7;
  --g1:#FFC400;--g2:#2A6FB8;--r:12px;--sh:0 2px 10px rgba(20,20,20,.07);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.45}
html[lang=ar] body{font-family:"IBM Plex Sans Arabic",Inter,system-ui,sans-serif;line-height:1.6}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
a{color:var(--info)}a:hover{color:#1C4590}
svg.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num,.lt{font-variant-numeric:tabular-nums}
bdi{unicode-bidi:isolate}
.mut{color:var(--mut)}.sm{font-size:13px}.b{font-weight:600}
.hide{display:none!important}

/* shell */
.app{display:flex;min-height:100vh}
.side{width:260px;flex:none;background:var(--bg);padding:0 0 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:8px;min-height:64px;padding-block:0;padding-inline:23px 14px;flex:none}
.logo{width:38px;height:38px;border-radius:10px;background:var(--y);display:grid;place-items:center;font-weight:800;color:var(--ink);flex:none;font-family:Inter,sans-serif;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.blogo{display:block;height:44px;width:auto;max-width:170px;object-fit:contain}
.brand .blogo{height:34px;max-width:110px;flex:none}
.bname{font-size:18px;font-weight:600;color:var(--tx);letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
html[lang=ar] .bname,html[lang=ar] .mhead{letter-spacing:0}
.mtog{margin-inline-start:auto;flex:none;width:34px;height:34px;display:grid;place-items:center;border:0;background:none;border-radius:50%;color:var(--mut);cursor:pointer}
.mtog:hover{background:rgba(18,18,18,.07);color:var(--tx)}
.mtog .mx{display:none}
html[dir=rtl] .mtog .mc{transform:scaleX(-1)}
.mnav{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.grp{display:flex;flex-direction:column}
.mhead{display:flex;align-items:center;gap:10px;margin-top:14px;padding:8px 0;color:var(--mut);font-size:12px;letter-spacing:.4px;text-transform:uppercase;white-space:nowrap}
.mhead::before{content:"";flex:none;width:13px;height:1px;background:rgba(18,18,18,.2)}
.mhead::after{content:"";flex:1;height:1px;background:rgba(18,18,18,.2);margin-inline-end:23px}
.nav,.sub{position:relative;display:flex;align-items:center;gap:8px;min-height:38px;padding:8px 23px;margin:0;margin-inline-end:18px;border:0;background:none;border-radius:0;border-start-end-radius:999px;border-end-end-radius:999px;color:#3B3B3B;text-decoration:none;font-size:15px;cursor:pointer;text-align:start}
.nav svg.ic{width:22px;height:22px}
.nav:hover,.sub:hover{background:rgba(18,18,18,.06);color:#121212}
.nav.on,.sub.on{background:linear-gradient(270deg,#FFC400 0%,#FFE27A 100%);color:var(--ink);font-weight:600;box-shadow:0 3px 6px rgba(18,18,18,.18)}
html[dir=rtl] .nav.on,html[dir=rtl] .sub.on{background:linear-gradient(90deg,#FFC400 0%,#FFE27A 100%)}
.nav .cnt,.sub .cnt{margin-inline-start:auto;background:var(--bad);color:#fff;border-radius:999px;font-size:12px;font-weight:600;padding:1px 8px}
.nav.on .cnt,.sub.on .cnt{background:#fff;color:var(--bad)}
.nav svg.chev{margin-inline-start:auto;transition:transform .15s;width:18px;height:18px;transform:rotate(-90deg)}
html[dir=rtl] .nav svg.chev{transform:rotate(90deg)}
.nav .cnt+svg.chev{margin-inline-start:0}
.grp.open>.nav svg.chev,html[dir=rtl] .grp.open>.nav svg.chev{transform:none}
.grp.open>.nav{background:rgba(18,18,18,.07)}
.nav.has-on{color:#121212;font-weight:600}
.subs{display:none;flex-direction:column;gap:6px;margin-top:6px}
.grp.open .subs{display:flex}
.sub{padding-inline-start:53px}
.sub::before{content:"";position:absolute;inset-inline-start:28px;top:50%;width:10px;height:10px;margin-top:-5px;box-sizing:border-box;border:1.5px solid currentColor;border-radius:50%;opacity:.75}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 28px;background:rgba(244,244,242,.92);backdrop-filter:blur(6px);position:sticky;top:0;z-index:20}
.top .burger{display:none}
@media (min-width:1200px){body.nomenu .side{display:none}body.nomenu .top .burger{display:inline-flex}}
.wrap{padding:24px 28px 48px;display:flex;flex-direction:column;gap:20px;max-width:1920px;width:100%;margin-inline:auto}
.av{width:36px;height:36px;border-radius:50%;background:var(--y);color:var(--ink);display:grid;place-items:center;font-weight:700;flex:none}
.who{display:flex;align-items:center;gap:10px;line-height:1.25;background:none;border:0;cursor:pointer;padding:4px;border-radius:10px}
.who:hover{background:#F6F6F4}
.srch{position:relative;flex:1 1 260px;max-width:440px}
.srch>svg{position:absolute;inset-inline-start:12px;top:12px;color:var(--mut)}
.srch .in{padding-inline-start:42px}
.sres{position:absolute;top:48px;inset-inline:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.12);z-index:30;max-height:360px;overflow:auto}
.sres a{display:block;padding:10px 14px;color:var(--tx);text-decoration:none;border-top:1px solid var(--line2)}
.sres a:hover{background:var(--ybg)}
.sp{flex:1}

/* type & blocks */
.h1{font-size:24px;font-weight:600;margin:0}
.h3{font-size:17px;font-weight:600;margin:0}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.phead .sub2{color:var(--mut);margin-top:4px}
.card{background:var(--card);border:0;box-shadow:var(--sh);border-radius:var(--r);padding:20px}
.card.flat{padding:0;overflow:hidden}
.chead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.col2{flex:2 1 520px;min-width:0;display:flex;flex-direction:column;gap:20px}
.col1{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:20px}
.row.eq{align-items:stretch}.row.eq>div>.card:last-child{flex:1 0 auto;display:flex;flex-direction:column}.row.eq .empty{margin:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.kpi{background:#fff;border:0;box-shadow:var(--sh);border-radius:var(--r);padding:16px 20px;border-inline-start:4px solid var(--y)}
.kpi .l{font-size:13px;color:var(--mut)}.kpi .v{font-size:28px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}.kpi .v.lg{font-size:22px}.kpi .v .num{white-space:nowrap}
.kpi .d{font-size:12.5px;color:var(--mut)}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (min-width:1900px){.charts{grid-template-columns:repeat(4,minmax(0,1fr))}}
.task{display:flex;align-items:center;gap:16px;padding:14px 0;border-top:1px solid var(--line2);flex-wrap:wrap}
.task:first-of-type{border-top:0}
.pairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 24px;margin-top:14px}
.pl{font-size:13px;color:var(--mut)}.pv{font-weight:500;overflow-wrap:anywhere}
.empty{padding:28px;text-align:center;color:var(--mut)}
.note{background:#F6F6F4;border-inline-start:3px solid var(--y);padding:10px 12px;border-radius:8px;font-size:14px}
.warnbox{display:flex;gap:10px;align-items:flex-start;background:var(--warnsoft);border-radius:10px;padding:12px 14px;color:#5C3B00;font-size:14px}
.okbox{display:flex;gap:10px;align-items:flex-start;background:var(--oksoft);border-radius:10px;padding:12px 14px;color:#14532F;font-size:14px}
.errbox{display:flex;gap:10px;align-items:flex-start;background:var(--badsoft);border-radius:10px;padding:12px 14px;color:#7A1A14;font-size:14px}
.vbox{display:flex;gap:10px;align-items:flex-start;background:var(--viosoft);border-radius:10px;padding:12px 14px;color:#4B2A8A;font-size:14px}
.okl{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.okl svg.ic{color:var(--ok);width:18px;height:18px;margin-top:1px}
.okl.no svg.ic{color:var(--bad)}
.dv{border-top:1px solid #ECEBEE;margin:16px 0}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.c-pend{background:var(--warnsoft);color:var(--warn)}.c-2nd{background:var(--viosoft);color:var(--vio)}
.c-appr{background:var(--infosoft);color:var(--info)}.c-iss{background:#EDEDED;color:#444}
.c-rec{background:var(--tealsoft);color:var(--teal)}.c-ben{background:#FFF1DE;color:var(--ydark)}
.c-clr{background:var(--oksoft);color:var(--ok)}.c-ret{background:var(--badsoft);color:var(--bad)}
.c-sol{background:#E6F4E7;color:#2E7D32;border:1px dashed #8CC98F}.c-can{background:#EEE;color:#555}
.c-lock{background:#FFF1DE;color:var(--ydark)}.c-open{background:#EDEDED;color:#444}
.role{background:var(--ysoft);color:var(--ydark)}
.late{color:var(--bad);font-weight:600}.soon{color:var(--warn);font-weight:600}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:10px 16px;font-size:14.5px;font-weight:600;cursor:pointer;text-decoration:none;min-height:44px;white-space:nowrap;background:#fff;color:var(--tx)}
.btn svg.ic{width:18px;height:18px}
.btn-y{background:var(--y);color:var(--ink);box-shadow:0 2px 4px rgba(255,196,0,.30)}.btn-y:hover{background:var(--y2);color:var(--ink)}
.btn-o{background:#fff;color:var(--tx);border:1px solid var(--in)}.btn-o:hover{background:#F6F6F4;color:var(--tx)}
.btn-g{background:#2E7D32;color:#fff}.btn-g:hover{background:#256A29;color:#fff}
.btn-r{background:#fff;color:var(--bad);border:1px solid #E8B4AF}.btn-r:hover{background:var(--badsoft);color:var(--bad)}
.btn-sm{min-height:36px;padding:7px 12px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.w{width:100%}
.in{width:100%;border:1px solid var(--in);border-radius:10px;padding:10px 12px;background:#fff;min-height:44px}
.in:focus{outline:none;border-color:var(--y);box-shadow:0 0 0 3px rgba(255,196,0,.25)}
.in.ro,.in:disabled{background:#F5F4F8;color:#444}
.in.err{border-color:var(--bad);box-shadow:0 0 0 3px rgba(179,38,30,.12)}
.in.warn{border-color:#D98A00;box-shadow:0 0 0 3px rgba(217,138,0,.18)}
textarea.in{min-height:80px;resize:vertical}
.lbl{display:block;font-size:13.5px;font-weight:600;color:#444;margin-bottom:6px}
.req{color:var(--bad)}
.hint{font-size:13px;color:var(--mut);margin-top:6px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px 18px;margin-top:16px}
.fgrid .full{grid-column:1/-1}
.fg{display:flex;flex-direction:column}
.chk{display:flex;align-items:center;gap:10px;margin:6px 0}
.chk input{width:18px;height:18px;accent-color:#FFC400}
.seg{display:inline-flex;border:1px solid var(--in);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg label{display:flex;align-items:center;gap:8px;padding:10px 16px;min-height:44px;cursor:pointer;font-weight:500}
.seg label+label{border-inline-start:1px solid var(--in)}
.seg label.on{background:var(--ysoft);font-weight:600}
.seg input{accent-color:#FFC400}
.sw{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:999px;background:var(--in);position:relative;margin:0;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:inset-inline-start .15s}
.sw:checked{background:var(--y)}.sw:checked::after{inset-inline-start:21px}
.swrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line2)}
.msgs{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow-y:auto;margin-top:10px;padding-inline-end:2px}
.msg{border:1px solid var(--in);border-radius:12px;padding:10px 12px;background:#fff;display:flex;flex-direction:column;gap:4px;max-width:94%}
.msg.me{align-self:flex-end;background:var(--ysoft);border-color:transparent}
.msg.new{border-color:var(--y);box-shadow:0 0 0 2px rgba(255,196,0,.25)}
.msg .mgh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.msg .mgt{white-space:normal;word-break:break-word;line-height:1.45}
.kwarn{margin-bottom:0}
.dt{position:relative}
.dt .in{padding-inline-end:44px}
.dtb{position:absolute;inset-inline-end:4px;top:4px;width:36px;height:36px;border:0;background:none;color:var(--mut);cursor:pointer;display:grid;place-items:center;border-radius:8px}
.dtb:hover{background:#F1F0F5}
.dtp{position:absolute;inset-inline-end:4px;top:4px;width:36px;height:36px;min-width:36px;opacity:0;border:0;padding:0;margin:0;cursor:pointer;z-index:2;font-size:16px;-webkit-appearance:none;appearance:none;background:transparent;color:transparent}
.dtp::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;cursor:pointer;opacity:0}
.dt:has(.dtp:hover) .dtb{background:#F1F0F5}
@media (pointer:coarse){input.in,select.in,textarea.in{font-size:16px}}
.n{width:26px;height:26px;border-radius:50%;background:#FFF1DE;color:var(--ydark);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.sec-h{display:flex;align-items:center;gap:10px}

/* tabs, filters, tables */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{display:inline-flex;align-items:center;gap:8px;border:1px solid #DEDCE2;background:#fff;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;color:#444;cursor:pointer;min-height:40px}
.tab b{background:#EEEDF2;border-radius:999px;padding:0 8px;font-size:12.5px}
.tab.on{background:var(--y);border-color:var(--y);color:var(--ink)}.tab.on b{color:var(--ydark)}.tab.on b{background:#fff}
.ul-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ul-tabs button{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
.ul-tabs button.on{color:#121212;border-bottom-color:var(--y)}
.fbar{display:flex;gap:10px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid #ECEBEE;align-items:center}
.fbar .srch{max-width:none}
.fbar select.in{width:auto;flex:0 1 190px}
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:start;font-size:13px;font-weight:600;color:var(--mut);padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FAFAFC}
.tbl td{padding:13px 16px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr.click{cursor:pointer}.tbl tr.click td{transition:background-color .12s}
.tbl tr.click:hover td{background:var(--ysoft)}.tbl tr.click:active td{background:#FFEFB8}
.tbl tr.click:focus-visible{outline:2px solid var(--y);outline-offset:-2px}
.task.click{cursor:pointer;margin:0 -12px;padding-inline:12px;border-radius:10px;transition:background-color .12s}
.task.click:hover{background:var(--ysoft)}.task.click:focus-visible{outline:2px solid var(--y);outline-offset:-2px}
.tbl.sm th,.tbl.sm td{padding:8px 10px;font-size:13.5px}
.tbl .num,.tbl th.num{text-align:end;white-space:nowrap}
.tbl tfoot td{font-weight:700;background:#FAFAFC}
/* roles & permissions: rights grid and access matrix */
.tbl tr.mxg td{background:#F4F4F2;font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--mut);padding:8px 16px}
html[lang=ar] .tbl tr.mxg td{letter-spacing:0}
.tbl.perm th.pc,.tbl.perm td.pc{text-align:center;width:84px}
.tbl.perm tr.pon td{background:var(--ybg)}
.pchk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;min-height:32px}
.pchk input{width:18px;height:18px;accent-color:#FFC400;cursor:pointer;margin:0}
.pchk.wf{margin-inline-end:14px;font-size:13.5px;white-space:nowrap}
.tbl.mx th{white-space:normal;min-width:96px;vertical-align:bottom}
.tbl.mx th a{color:inherit}
.tbl.mx td{white-space:nowrap;padding:9px 14px}
.tbl.mx td:first-child,.tbl.mx th:first-child{position:sticky;inset-inline-start:0;background:#fff;z-index:1;white-space:normal;min-width:180px}
.tbl.mx th:first-child{background:#FAFAFC}
.mxkey{margin:0 16px 14px;padding:12px 16px;border:1px solid var(--yline);background:var(--ybg);border-radius:12px}
.mxkh{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-bottom:8px}.mxkh .ic{width:18px;height:18px}
.mxkl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 18px;font-size:13px}
.mxk{display:flex;align-items:center;gap:8px}
.mxi{display:inline-grid;place-items:center;width:24px;height:24px;color:var(--ink)}.mxi .ic{width:17px;height:17px}
.mxi.off{visibility:hidden}.mxi.ok{color:#1E7B34}.mxi.ok .ic{stroke-width:2.6}
.mxdash{color:#C4C1BA}
.tbl.mx th:not(:first-child),.tbl.mx td.mxc{text-align:center}
.tbl.mx td.mxc{padding:7px 10px}
.tbl.mx tr.mxs td{background:#FCFCFA}.tbl.mx tr.mxs td:first-child{padding-inline-start:36px;color:var(--mut);font-size:13px;background:#FCFCFA}
.lnk{color:var(--tx);font-weight:600;text-decoration:none}.lnk:hover{color:var(--info);text-decoration:underline}
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px}
.pager select{width:auto;min-height:36px;padding:6px 10px}

/* cheque page */
.steps7{position:relative;min-width:720px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.steps7 .ln{position:absolute;inset-inline:7%;top:12px;height:2px;background:#E4E2EA}
.steps7 .ln i{display:block;height:100%;background:#FFC400}
.step{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;font-size:13px}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#fff;border:3px solid #fff;box-shadow:0 0 0 1px #C9C5D2;position:relative;z-index:1;color:#121212}
.dot svg.ic{width:14px;height:14px;stroke-width:3}
.dot.d{background:var(--y);color:var(--ink);box-shadow:0 0 0 1px #FFC400}
.dot.cur{box-shadow:0 0 0 2px #FFC400}
.dot.end{background:#2E7D32;color:#fff;box-shadow:0 0 0 1px #2E7D32}
.dot.x{background:var(--bad);color:#fff;box-shadow:0 0 0 1px var(--bad)}
.dot.skip{border-style:solid;box-shadow:0 0 0 1px #B9B5C3}
.rate{border:1px solid var(--yline);background:var(--ybg);border-radius:12px;padding:14px 16px}
.rate .big{font-size:19px;font-weight:600;margin-top:8px}
.line{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid #F6E3C6;font-variant-numeric:tabular-nums}
.loss{color:var(--bad);font-weight:600}.gain{color:var(--info);font-weight:600}
.tl{position:relative;padding:0 0 16px;padding-inline-start:24px}
.tl::before{content:"";position:absolute;inset-inline-start:5px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--y);box-shadow:0 0 0 2px #FFC400}
.tl::after{content:"";position:absolute;inset-inline-start:10px;top:20px;bottom:0;width:1px;background:var(--line)}
.tl:last-child::after{display:none}
.act{border:1px solid var(--yline);background:var(--ybg)}
.file{display:inline-flex;align-items:center;gap:10px;border:1px solid #DEDCE2;border-radius:10px;padding:8px 12px;text-decoration:none;color:var(--tx);background:#fff}
.drop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px dashed var(--in);border-radius:12px;padding:12px 14px;background:#FAFAFC}
.prog{height:10px;background:#EEEDF2;border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--g1);border-radius:6px}
.entry{border:1px solid #ECEBEE;border-radius:12px;padding:12px 14px;margin-top:12px;background:#fff}

/* charts */
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:inherit;fill:#5A554D;font-size:12px}
.chart .ax{stroke:#D8D6D0}.chart .gr{stroke:#EFEDE8}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:#444;margin:4px 0 8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
#tip{position:fixed;z-index:200;pointer-events:none;background:#1F1F1F;color:#fff;font-size:12.5px;padding:7px 10px;border-radius:8px;max-width:260px;white-space:pre-line;box-shadow:0 6px 18px rgba(0,0,0,.2);display:none}

/* modal, toast */
.ov{position:fixed;inset:0;background:rgba(20,20,20,.45);display:flex;justify-content:center;align-items:flex-start;padding:40px 16px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:16px;width:100%;max-width:680px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{max-width:860px}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:18px 22px;border-bottom:1px solid #ECEBEE}
.mh h2{margin:0;font-size:19px;font-weight:600}
.mb{padding:20px 22px}
.mf{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;padding:14px 22px;border-top:1px solid #ECEBEE;background:#FAFAFC;border-radius:0 0 16px 16px}
.x{background:none;border:0;padding:6px;cursor:pointer;color:var(--mut);border-radius:8px}.x:hover{background:#F1F0F5}
/* notifications */
.nbw{position:relative}
.nbell{position:relative;width:40px;padding:0;justify-content:center}
.nbell.on{border-color:var(--yline);background:var(--ybg)}
.nbadge{position:absolute;top:-7px;inset-inline-end:-7px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;line-height:1;box-shadow:0 0 0 2px var(--bg)}
.npanel{position:absolute;top:calc(100% + 10px);inset-inline-end:0;width:420px;max-width:calc(100vw - 24px);max-height:min(74vh,660px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 40px rgba(0,0,0,.16);z-index:60;text-align:start}
.nhd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;position:sticky;top:0;background:#fff;z-index:1}
.nsum{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px}
.nchip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--ybg);border:1px solid var(--yline);color:var(--ink);font-size:13px;text-decoration:none}
.nchip .ic{width:15px;height:15px}.nchip b{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ink);color:#fff;font-size:11px;display:grid;place-items:center}
.nsec{padding:12px 16px 6px;font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;border-top:1px solid var(--line2)}
.nit{display:flex;gap:12px;align-items:flex-start;padding:10px 16px;color:inherit;text-decoration:none;position:relative}
.nit:hover,.nit:focus-visible{background:var(--line2)}
.nit.new{background:var(--ybg)}.nit.new:hover{background:var(--ysoft)}
.ni{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--ysoft);color:var(--ink)}.ni .ic{width:16px;height:16px}
.ni.bad{background:var(--badsoft);color:var(--bad)}
.nb{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.nh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600;font-size:14px}
.nh .chip{font-size:11px;padding:2px 8px}
.nt{font-size:13px;color:var(--tx);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.nw{font-size:12px;color:var(--mut)}
.ndot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--bad);margin-top:6px}
.nmore{display:block;padding:10px 16px;font-size:13px}
.nempty{display:grid;justify-items:center;gap:6px;padding:28px 20px 32px;text-align:center}.nempty .ic{width:28px;height:28px;color:var(--ok)}
.nalert{position:fixed;top:76px;inset-inline-end:20px;z-index:250;width:380px;max-width:calc(100vw - 24px);background:#fff;border:1px solid var(--yline);border-inline-start:5px solid var(--y);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.18);padding:12px 14px;display:grid;gap:8px;animation:nin .25s ease-out}
@keyframes nin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.nah{display:flex;align-items:center;gap:8px}.nah b{flex:1}.nah .ic{width:18px;height:18px}
.nai{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:10px;background:var(--line2);color:inherit;text-decoration:none}
.nai:hover{background:var(--ysoft)}
.nalert .btn{justify-self:start}
@media (max-width:640px){.npanel{position:fixed;top:64px;inset-inline:8px;width:auto;max-height:calc(100vh - 80px)}.nalert{top:auto;bottom:16px;inset-inline:12px;width:auto}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#fff;color:var(--tx);padding:12px 18px;border-radius:12px;z-index:300;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);border-inline-start:4px solid var(--y);max-width:min(560px,92vw)}

/* sign-in */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg)}
.lcard{width:100%;max-width:460px;background:#fff;border-radius:10px;border:0;box-shadow:0 16px 40px rgba(20,20,20,.10);padding:32px}
.lcard h1{font-size:24px;font-weight:600;margin:24px 0 4px}
.lcard form{display:flex;flex-direction:column;gap:16px;margin-top:22px}
.pol{font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:4px;margin-top:6px}
.pol .ok{color:var(--ok)}.pol .no{color:var(--mut)}

@media (max-width:1199px){
  .side{position:fixed;top:0;bottom:0;inset-inline-start:-270px;z-index:60;transition:inset-inline-start .2s;box-shadow:0 0 40px rgba(0,0,0,.15);height:100%;height:100dvh;max-height:100dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  .side .mnav{flex:none}
  body.menuopen{overflow:hidden}
  .side.open{inset-inline-start:0}
  .side.open+.main::before{content:"";position:fixed;inset:0;background:rgba(18,18,18,.35);z-index:50}
  .top .burger{display:inline-flex}
  .mtog .mc{display:none}.mtog .mx{display:block}
}
@media (max-width:900px){
  .wrap{padding:16px}
  .top{padding:10px 16px}
  .who .nm{display:none}
  .charts{grid-template-columns:1fr}
}
@media (max-width:720px){
  .tbl.cards thead{display:none}
  .tbl.cards tr{display:block;border-bottom:1px solid var(--line);padding:10px 16px}
  .tbl.cards td{display:flex;justify-content:space-between;gap:12px;border:0;padding:4px 0;text-align:start!important}
  .tbl.cards td::before{content:attr(data-h);color:var(--mut);font-size:13px;flex:none}
  .tbl.cards td:first-child::before{content:none}
  .kpi .v{font-size:24px}
}
@media print{.side,.top,.btn,.pager,.fbar{display:none!important}.wrap{padding:0}.card{border:0}}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal"></div>
<div id="toast"></div>
<div id="tip"></div>
<script src="/js/i18n.js?v=2.8"></script>
<script src="/js/app.js?v=2.8"></script>
<script src="/js/charts.js?v=2.8"></script>
<script src="/js/pages.js?v=2.8"></script>
<script src="/js/pages2.js?v=2.8"></script>
<script>boot();</script>
</body>
</html>
